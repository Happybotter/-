<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简易消消乐（带音效）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#78c0e8;display:flex;flex-direction:column;align-items:center;padding:20px}
#info{font-size:22px;margin-bottom:10px;color:#222}
#gameBox{
    display:grid;
    grid-template-columns: repeat(7, 60px);
    gap:4px;
    background:rgba(0,0,0,0.2);
    padding:6px;
    border-radius:8px;
}
.cell{
    width:60px;height:60px;
    background:#fff;
    border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    font-size:32px;
    cursor:pointer;
    user-select:none;
    transition: transform 0.15s;
}
.cell.empty{background:transparent}
.cell.selected{transform:scale(0.92);box-shadow:0 0 0 3px gold}
</style>
</head>
<body>
<div id="info">分数：<span id="score">0</span></div>
<div id="gameBox"></div>

<!-- 音效 -->
<audio id="sndSelect" src="https://assets.mixkit.co/sfx/preview/mixkit-select-click-1109.mp3" preload="auto">
<audio id="sndSwapFail" src="https://assets.mixkit.co/sfx/preview/mixkit-software-interface-start-2574.mp3" preload="auto">
<audio id="sndMatch" src="https://assets.mixkit.co/sfx/preview/mixkit-winning-chimes-2015.mp3" preload="auto">
<audio id="sndChain" src="https://assets.mixkit.co/sfx/preview/mixkit-achievement-bell-600.mp3" preload="auto">

<script>
const COLS = 7;
const ROWS = 7;
const ITEMS = ['🐱','🐶','🐰','🦊','🐻','🐼'];
let board = [];
let selected = null;
let score = 0;
let isMoving = false;
const gameBox = document.getElementById('gameBox');
const scoreDom = document.getElementById('score');

// 音效工具
function playAudio(elId){
    const audio = document.getElementById(elId);
    audio.currentTime = 0;
    audio.play().catch(e=>{});
}

// 初始化棋盘
function initBoard(){
    board = [];
    for(let y=0;y<ROWS;y++){
        board[y] = [];
        for(let x=0;x<COLS;x++){
            board[y][x] = randomItem();
        }
    }
    // 消除开局自带三消
    while(hasMatch()){
        for(let y=0;y<ROWS;y++){
            for(let x=0;x<COLS;x++){
                board[y][x] = randomItem();
            }
        }
    }
    render();
}

function randomItem(){
    return ITEMS[Math.floor(Math.random()*ITEMS.length)];
}

// 渲染界面
function render(){
    gameBox.innerHTML = '';
    for(let y=0;y<ROWS;y++){
        for(let x=0;x<COLS;x++){
            const div = document.createElement('div');
            div.className = 'cell';
            if(board[y][x]) div.textContent = board[y][x];
            else div.classList.add('empty');
            div.dataset.x = x;
            div.dataset.y = y;
            if(selected && selected.x===x && selected.y===y){
                div.classList.add('selected');
            }
            div.onclick = ()=>clickCell(x,y);
            gameBox.appendChild(div);
        }
    }
    scoreDom.textContent = score;
}

function clickCell(x,y){
    if(isMoving) return;
    playAudio("sndSelect");
    if(!selected){
        selected = {x,y};
        render();
    }else{
        const dx = Math.abs(selected.x - x);
        const dy = Math.abs(selected.y - y);
        // 判断相邻上下左右
        if((dx===1&&dy===0) || (dx===0&&dy===1)){
            swap(selected.x, selected.y, x, y);
        }
        selected = null;
        render();
    }
}

// 交换两个格子
async function swap(x1,y1,x2,y2){
    isMoving = true;
    [board[y1][x1], board[y2][x2]] = [board[y2][x2], board[y1][x1]];
    render();

    if(hasMatch()){
        await processMatches();
    }else{
        // 没有匹配，交换回来
        playAudio("sndSwapFail");
        await sleep(150);
        [board[y1][x1], board[y2][x2]] = [board[y2][x2], board[y1][x1]];
        render();
    }
    isMoving = false;
}

// 查找所有需要消除的格子
function findMatches(){
    const matched = new Set();
    // 横向
    for(let y=0;y<ROWS;y++){
        for(let x=0;x<COLS-2;x++){
            const v = board[y][x];
            if(!v) continue;
            if(v===board[y][x+1] && v===board[y][x+2]){
                matched.add(`${x},${y}`);
                matched.add(`${x+1},${y}`);
                matched.add(`${x+2},${y}`);
                let k = x+3;
                while(k<COLS && board[y][k]===v){
                    matched.add(`${k},${y}`);
                    k++;
                }
            }
        }
    }
    // 纵向
    for(let x=0;x<COLS;x++){
        for(let y=0;y<ROWS-2;y++){
            const v = board[y][x];
            if(!v) continue;
            if(v===board[y+1][x] && v===board[y+2][x]){
                matched.add(`${x},${y}`);
                matched.add(`${x},${y+1}`);
                matched.add(`${x},${y+2}`);
                let k = y+3;
                while(k<ROWS && board[k][x]===v){
                    matched.add(`${x},${k}`);
                    k++;
                }
            }
        }
    }
    return matched;
}

function hasMatch(){
    return findMatches().size > 0;
}

async function processMatches(){
    let chainCount = 0;
    let matched = findMatches();
    while(matched.size>0){
        chainCount++;
        if(chainCount===1){
            playAudio("sndMatch");
        }else{
            playAudio("sndChain");
        }
        // 计分+清空
        score += matched.size * 10;
        matched.forEach(key=>{
            const [x,y] = key.split(',').map(Number);
            board[y][x] = null;
        });
        render();
        await sleep(200);

        // 方块下落
        dropBlocks();
        render();
        await sleep(150);

        // 顶部生成新方块
        fillEmpty();
        render();
        await sleep(150);

        matched = findMatches();
    }
}

// 方块下落
function dropBlocks(){
    for(let x=0;x<COLS;x++){
        for(let y=ROWS-1;y>=0;y--){
            if(board[y][x]===null){
                // 向上寻找有内容的方块落下来
                for(let k=y-1;k>=0;k--){
                    if(board[k][x]){
                        board[y][x] = board[k][x];
                        board[k][x] = null;
                        break;
                    }
                }
            }
        }
    }
}

// 空白处顶部生成新元素
function fillEmpty(){
    for(let x=0;x<COLS;x++){
        for(let y=0;y<ROWS;y++){
            if(board[y][x]===null){
                board[y][x] = randomItem();
            }
        }
    }
}

function sleep(ms){
    return new Promise(res=>setTimeout(res,ms));
}

initBoard();
</script>
</body>
</html>
